<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Otter mascot — Flo">
  <title>Flo the Otter</title>
  <!-- Body (rounded oval) -->
  <ellipse cx="100" cy="120" rx="62" ry="58" fill="#8B5A2B"/>
  <!-- Cream belly -->
  <ellipse cx="100" cy="130" rx="40" ry="40" fill="#F4E6D0"/>
  <!-- Paws (holding up, kawaii) -->
  <ellipse cx="55" cy="95" rx="14" ry="10" fill="#8B5A2B" transform="rotate(-20 55 95)"/>
  <ellipse cx="145" cy="95" rx="14" ry="10" fill="#8B5A2B" transform="rotate(20 145 95)"/>
  <circle cx="50" cy="92" r="5" fill="#F4E6D0"/>
  <circle cx="150" cy="92" r="5" fill="#F4E6D0"/>
  <!-- Face area -->
  <ellipse cx="100" cy="100" rx="44" ry="38" fill="#8B5A2B"/>
  <!-- Cream face mask -->
  <ellipse cx="100" cy="110" rx="32" ry="28" fill="#F4E6D0"/>
  <!-- Eyes (round, glossy) -->
  <circle cx="84" cy="100" r="8" fill="#0B0B0F"/>
  <circle cx="116" cy="100" r="8" fill="#0B0B0F"/>
  <circle cx="86" cy="97" r="2.5" fill="#F4F4F1"/>
  <circle cx="118" cy="97" r="2.5" fill="#F4F4F1"/>
  <!-- Nose -->
  <ellipse cx="100" cy="118" rx="6" ry="5" fill="#0B0B0F"/>
  <!-- Mouth -->
  <path d="M100 124 Q 92 132 88 126 M 100 124 Q 108 132 112 126" stroke="#0B0B0F" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Whisker dots -->
  <circle cx="78" cy="115" r="1.5" fill="#0B0B0F"/>
  <circle cx="78" cy="120" r="1.5" fill="#0B0B0F"/>
  <circle cx="122" cy="115" r="1.5" fill="#0B0B0F"/>
  <circle cx="122" cy="120" r="1.5" fill="#0B0B0F"/>
  <!-- Blush -->
  <circle cx="70" cy="115" r="6" fill="#B71234" opacity="0.3"/>
  <circle cx="130" cy="115" r="6" fill="#B71234" opacity="0.3"/>
</svg>