<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Robot mascot — Bibo">
  <title>Bibo the Robot</title>
  <!-- Antenna -->
  <line x1="100" y1="35" x2="100" y2="55" stroke="#C9A961" stroke-width="3" stroke-linecap="round"/>
  <circle cx="100" cy="30" r="6" fill="#C9A961"/>
  <circle cx="100" cy="30" r="3" fill="#E6CF9A"/>
  <!-- Head (rounded square) -->
  <rect x="55" y="55" width="90" height="80" rx="14" fill="#0B0B0F"/>
  <!-- Screen face -->
  <rect x="65" y="65" width="70" height="50" rx="6" fill="#0E2A47"/>
  <!-- Eyes (LED) -->
  <circle cx="83" cy="90" r="6" fill="#C9A961"/>
  <circle cx="117" cy="90" r="6" fill="#C9A961"/>
  <circle cx="83" cy="90" r="2.5" fill="#E6CF9A"/>
  <circle cx="117" cy="90" r="2.5" fill="#E6CF9A"/>
  <!-- Smile (pixel) -->
  <path d="M88 105 L 92 105 L 92 108 L 96 108 L 96 105 L 104 105 L 104 108 L 108 108 L 108 105 L 112 105" stroke="#C9A961" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Side bolts -->
  <circle cx="50" cy="95" r="5" fill="#C9A961"/>
  <circle cx="150" cy="95" r="5" fill="#C9A961"/>
  <!-- Body (small) -->
  <rect x="70" y="140" width="60" height="35" rx="6" fill="#15151B"/>
  <!-- Body buttons -->
  <circle cx="85" cy="158" r="3" fill="#B71234"/>
  <circle cx="100" cy="158" r="3" fill="#C9A961"/>
  <circle cx="115" cy="158" r="3" fill="#25D366"/>
  <!-- Logo on chest -->
  <rect x="92" y="148" width="6" height="6" rx="1" fill="none" stroke="#C9A961" stroke-width="1"/>
  <rect x="100" y="148" width="6" height="6" rx="1" fill="#C9A961"/>
  <rect x="92" y="156" width="6" height="6" rx="1" fill="none" stroke="#C9A961" stroke-width="1"/>
  <rect x="100" y="156" width="6" height="6" rx="1" fill="none" stroke="#C9A961" stroke-width="1"/>
</svg>